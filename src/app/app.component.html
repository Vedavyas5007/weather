<div class="container">
    <div class="weather-app">
        <h1>Weather App  </h1>
        <div class="search">
            <input type="text" placeholder="Enter city name" (input)="cityText($event)" />
            <button (click)="myWeather()">Get Weather</button>
        </div>
        <div *ngIf="dcity!=''">
            <h2>City: {{ dcity }}</h2>
            <img src={{image}} alt="">
            <p>Temperature: {{ tempC }}°C</p>
            <p>Temperature: {{ tempF }}°F</p>
            <p>Humidity: {{ humidity }}%</p>
            <p>Wind Speed: {{ wind }} km/hr</p>
        </div>
    </div>
</div>
